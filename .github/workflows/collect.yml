name: Auslastung sammeln

# Wird alle 15 Minuten von außen (cron-job.org) über die GitHub-API gestartet,
# weil GitHubs eigener Zeitplan viele Läufe auslässt.
on:
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig, sonst kollidieren die Commits
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/collect.py
      - name: Daten committen
        run: |
          git config user.name "auslastung-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/auslastung.csv
          git diff --cached --quiet && exit 0
          git commit -m "Auslastung $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
