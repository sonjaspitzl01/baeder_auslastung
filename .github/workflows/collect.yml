name: Auslastung sammeln

on:
  schedule:
    - cron: "*/15 5-21 * * *"   # alle 15 Min, ca. 6–23 Uhr Wiener Zeit (Cron läuft in UTC)
  workflow_dispatch:            # manuell starten zum Testen

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/collect.py
      - name: Daten committen
        run: |
          git config user.name "auslastung-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/auslastung.csv
          git diff --cached --quiet || git commit -m "Auslastung $(date -u +%FT%H:%M)"
          git push
