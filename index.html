<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie voll ist das Bad?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F8F9; --tile: #FFFFFF; --grout: #CBD8DC; --ink: #0F2E3A; --muted: #557380;
  --w0: #E3F3F5; --w1: #A9DDE2; --w2: #4FB3C1; --w3: #1B7C93; --w4: #0A4561;
  --full: #E0603A;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0C1F27; --tile: #13303B; --grout: #24444F; --ink: #E6F1F3; --muted: #8FADB7;
    --w0: #1A3E4A; --w1: #1F5F6E; --w2: #2C8C9E; --w3: #5BC0CF; --w4: #B4ECF2;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--body); }
main { max-width: 68rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
h1 { font: 800 clamp(2.2rem, 6vw, 4rem)/1 var(--display); letter-spacing: -0.02em; margin: 0 0 .5rem; }
.lead { color: var(--muted); max-width: 38rem; margin: 0 0 2rem; }

.baeder { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.75rem; }
.baeder button {
  font: 700 .95rem var(--body); color: var(--ink); background: var(--tile);
  border: 2px solid var(--grout); border-radius: 999px; padding: .45rem 1rem; cursor: pointer;
}
.baeder button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--full); outline-offset: 2px; }

.answer { font: 500 clamp(1.3rem, 3vw, 1.9rem)/1.25 var(--display); min-height: 2.6em; margin: 0 0 1.25rem; }
.answer small { display: block; font: 400 .95rem var(--body); color: var(--muted); margin-top: .3rem; }

.scroll { overflow-x: auto; padding-bottom: .5rem; }
.grid {
  display: grid; grid-template-columns: 3rem repeat(var(--cols), minmax(2.1rem, 1fr));
  gap: 3px; background: var(--grout); padding: 3px; border-radius: 6px; min-width: 40rem;
}
.head, .day { background: var(--bg); color: var(--muted); font-size: .8rem; display: grid; place-items: center; padding: .25rem 0; }
.day { font-weight: 700; color: var(--ink); }
.tile {
  aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; background: var(--tile);
  font: 700 .72rem var(--body); color: transparent;
}
.tile.empty { background: repeating-linear-gradient(45deg, var(--tile) 0 4px, var(--bg) 4px 8px); cursor: default; }
.tile.sel { box-shadow: inset 0 0 0 3px var(--full); color: inherit; }
.tile:hover:not(.empty) { color: inherit; }

.legend { display: flex; align-items: center; gap: .6rem; margin-top: 1rem; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.legend span { width: 1.4rem; height: 1rem; display: inline-block; border-radius: 2px; }
.note { margin-top: 2.5rem; font-size: .85rem; color: var(--muted); max-width: 40rem; }
@media (prefers-reduced-motion: no-preference) { .tile { transition: background-color .25s; } }
</style>
</head>
<body>
<main>
  <h1>Wie voll ist das Bad?</h1>
  <p class="lead">Durchschnittliche Auslastung der LINZ AG Bäder pro Wochentag und Stunde, aus eigenen Messungen alle 15 Minuten. Tippe auf ein Feld für den genauen Wert.</p>

  <div class="baeder" id="baeder" role="group" aria-label="Bad auswählen"></div>
  <p class="answer" id="answer" aria-live="polite"></p>
  <div class="scroll"><div class="grid" id="grid"></div></div>

  <div class="legend" id="legend"></div>
  <p class="note" id="note"></p>
</main>

<script>
const TAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const TAGE_LANG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const START = 6, ENDE = 22; // angezeigte Stunden 6–21 Uhr
const STUFEN = ["--w0", "--w1", "--w2", "--w3", "--w4"];

let stats = {}, aktuellesBad = null, auswahl = null;

function farbe(p) {
  if (p >= 90) return "var(--full)";
  return `var(${STUFEN[Math.min(4, Math.floor(p / 20))]})`;
}

function parseCSV(text) {
  return text.trim().split(/\r?\n/).slice(1).map(z => {
    const [zeit, bad, wert] = z.split(",");
    return { zeit, bad: bad.replace(/^"|"$/g, ""), wert: parseFloat(wert) };
  }).filter(r => r.zeit && !isNaN(r.wert));
}

function demoDaten() {
  const rows = [], baeder = ["Parkbad", "Hummelhof", "Schörgenhub", "Biesenfeld"];
  for (let d = 0; d < 56; d++) {
    const datum = new Date(2026, 8, 1 + d);
    for (let h = 6; h < 22; h++) for (const [i, b] of baeder.entries()) {
      const wt = (datum.getDay() + 6) % 7;
      const peak = wt >= 5 ? 14 : (h < 10 ? 7 : 17);
      const basis = 70 * Math.exp(-((h - peak) ** 2) / 10) + (wt >= 5 ? 15 : 5) + i * 4;
      const p = Math.max(0, Math.min(100, basis + (Math.random() - .5) * 20));
      const zeit = `${datum.toISOString().slice(0, 10)}T${String(h).padStart(2, "0")}:00`;
      rows.push({ zeit, bad: b, wert: p });
    }
  }
  return rows;
}

function auswerten(rows) {
  const s = {};
  for (const { zeit, bad, wert } of rows) {
    const [datum, uhr] = zeit.split("T");
    const [y, m, d] = datum.split("-").map(Number);
    const wt = (new Date(y, m - 1, d).getDay() + 6) % 7;
    const h = parseInt(uhr, 10);
    s[bad] ??= {};
    const key = `${wt}-${h}`;
    s[bad][key] ??= { sum: 0, n: 0 };
    s[bad][key].sum += wert; s[bad][key].n++;
  }
  return s;
}

function baederButtons() {
  const box = document.getElementById("baeder");
  box.innerHTML = "";
  for (const bad of Object.keys(stats).sort()) {
    const b = document.createElement("button");
    b.textContent = bad;
    b.setAttribute("aria-pressed", bad === aktuellesBad);
    b.onclick = () => { aktuellesBad = bad; baederButtons(); zeichnen(); };
    box.append(b);
  }
}

function zeichnen() {
  const grid = document.getElementById("grid");
  const daten = stats[aktuellesBad] || {};
  grid.style.setProperty("--cols", ENDE - START);
  grid.innerHTML = '<div class="head"></div>';
  for (let h = START; h < ENDE; h++) grid.insertAdjacentHTML("beforeend", `<div class="head">${h}</div>`);

  TAGE.forEach((tag, wt) => {
    grid.insertAdjacentHTML("beforeend", `<div class="day">${tag}</div>`);
    for (let h = START; h < ENDE; h++) {
      const c = daten[`${wt}-${h}`];
      const t = document.createElement("button");
      t.className = "tile";
      if (!c) {
        t.classList.add("empty"); t.disabled = true;
        t.setAttribute("aria-label", `${TAGE_LANG[wt]} ${h} Uhr: keine Daten`);
      } else {
        const p = Math.round(c.sum / c.n);
        t.style.background = farbe(p);
        t.style.color = p >= 60 ? "#fff" : "";
        t.textContent = p;
        t.setAttribute("aria-label", `${TAGE_LANG[wt]} ${h} Uhr: ${p} Prozent`);
        if (auswahl && auswahl.wt === wt && auswahl.h === h) t.classList.add("sel");
        t.onclick = () => { auswahl = { wt, h }; zeichnen(); };
      }
      grid.append(t);
    }
  });
  antwort(daten);
}

function antwort(daten) {
  const el = document.getElementById("answer");
  if (!auswahl) { el.innerHTML = `${aktuellesBad}<small>Wähle einen Wochentag und eine Uhrzeit im Raster.</small>`; return; }
  const c = daten[`${auswahl.wt}-${auswahl.h}`];
  const zeit = `${TAGE_LANG[auswahl.wt]}, ${auswahl.h}:00–${auswahl.h + 1}:00`;
  if (!c) { el.innerHTML = `${zeit}<small>Für ${aktuellesBad} gibt’s zu dieser Zeit noch keine Messungen.</small>`; return; }
  const p = Math.round(c.sum / c.n);
  const wort = p < 25 ? "meist ruhig" : p < 50 ? "mäßig besucht" : p < 75 ? "gut besucht" : "oft sehr voll";
  el.innerHTML = `${aktuellesBad}, ${zeit}: ${p} %, ${wort}<small>Durchschnitt aus ${c.n} Messungen</small>`;
}

function legende() {
  const l = document.getElementById("legend");
  l.innerHTML = "0 %" + STUFEN.map(v => `<span style="background:var(${v})"></span>`).join("")
    + '<span style="background:var(--full)"></span> 100 %';
}

async function start() {
  const demo = new URLSearchParams(location.search).has("demo");
  let rows = [];
  if (demo) rows = demoDaten();
  else {
    try {
      const r = await fetch("data/auslastung.csv", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      rows = parseCSV(await r.text());
    } catch (e) { rows = []; }
  }

  const note = document.getElementById("note");
  if (!rows.length) {
    document.getElementById("answer").innerHTML =
      'Noch keine Messdaten<small>Der Sammler legt data/auslastung.csv an, sobald er das erste Mal läuft. Mit <a href="?demo">?demo</a> siehst du eine Vorschau mit Zufallswerten.</small>';
    return;
  }
  stats = auswerten(rows);
  aktuellesBad = Object.keys(stats).sort()[0];
  const zeiten = rows.map(r => r.zeit).sort();
  note.textContent = demo
    ? "Vorschau mit erfundenen Werten – das sind keine echten Daten."
    : `${rows.length} Messwerte von ${zeiten[0].slice(0, 10)} bis ${zeiten.at(-1).slice(0, 10)}. Je länger der Sammler läuft, desto verlässlicher die Durchschnitte.`;
  baederButtons(); legende(); zeichnen();
}
start();
</script>
</body>
</html>
